name: Windows beta

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test shared Rust code
        run: cargo test --locked --workspace --lib --features custom-protocol
      - name: Build Windows installer
        run: pnpm --filter @orvex/desktop tauri build --bundles nsis --features custom-protocol
      - name: Prepare downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          $installers | Copy-Item -Destination release
          Get-ChildItem release/*.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta-x64
          path: release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-beta-x64
          path: release
      - name: Publish Windows UI beta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.txt <<'NOTES'
          Windows x64 interface and installer beta.

          Download the setup.exe installer. Test installation, launch, the redesigned interface, navigation, Refresh and uninstall.

          Workspace VMs, Linux terminals, guest execution and environment provisioning are NOT supported on Windows yet. The app displays this limitation and disables workspace creation.

          This build is unsigned, so Windows may display a publisher/SmartScreen warning. Do not disable system protections to install it. WebView2 may be installed by the setup program if needed.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --latest=false --title "Orvex $RELEASE_TAG — Windows UI beta" --notes-file /tmp/release-notes.txt
          fi
