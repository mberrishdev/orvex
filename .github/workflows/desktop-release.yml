name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            bundles: app,dmg
          - os: windows-2022
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require updater signing key
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Validate release version and configure update channel
        shell: bash
        run: python scripts/release-artifacts.py prepare --tag "$RELEASE_TAG"
      - name: Test release artifact validation
        run: python scripts/test-release-artifacts.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop update flow
        run: pnpm --filter @orvex/desktop test:updates
      - name: Test MCP onboarding
        run: pnpm --filter @orvex/desktop test:mcp
      - name: Build frontend assets for Rust tests
        run: pnpm --filter @orvex/desktop build
      - name: Test shared Rust code
        run: cargo test --locked --workspace --lib --features custom-protocol
      - name: Build installer
        run: pnpm --filter @orvex/desktop tauri build --bundles ${{ matrix.bundles }} --features custom-protocol
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict target/release/bundle/macos/Orvex.app
      - name: Collect signed updater artifacts
        shell: bash
        run: python scripts/release-artifacts.py collect --platform "${{ matrix.platform }}" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: false
      - name: Assemble updater manifest and checksums
        run: python3 scripts/release-artifacts.py merge
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > /tmp/release-notes.txt <<'NOTES'
          Signed macOS and Windows desktop release.

          Orvex checks for signed updates automatically. You can also check from App updates.
          Install this updater-enabled version once manually to receive future updates.
          macOS: Apple Silicon. Windows: x64. Windows runtime support remains experimental.
          Updater signatures verify downloads; OS code signing/notarization is not configured.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --latest=false --title "Orvex $RELEASE_TAG" --notes-file /tmp/release-notes.txt
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --latest --title "Orvex $RELEASE_TAG" --notes-file /tmp/release-notes.txt
          fi
          # Beta clients also graduate to stable releases through this feed.
          # Never publish a partial manifest while either platform is still building.
          if ! gh release view updater-beta >/dev/null 2>&1; then
            gh release create updater-beta --target "$GITHUB_SHA" --prerelease --latest=false --title "Orvex Beta Update Channel" --notes "Rolling updater manifest for beta installations. Install from a versioned Orvex release."
          fi
          gh release upload updater-beta release/latest.json --clobber
