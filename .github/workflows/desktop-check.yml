name: Desktop checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orvex/desktop test:updates
      - run: pnpm --filter @orvex/desktop test:mcp
      - run: python scripts/test-release-artifacts.py
      - name: Test macOS installer without installing
        if: runner.os == 'macOS'
        run: python3 scripts/test-install-sh.py
      - name: Test Windows installer without installing
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install.ps1
      - run: pnpm build
      - run: cargo test --locked --workspace --lib --features custom-protocol
      - run: cargo build --locked --workspace --features custom-protocol
      - run: pnpm check:mcp
